<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gallery - Sri Mahavishnu Colour Graphicz Press Facility, Machines & Behind The Scenes">
  <title>Gallery | Sri Mahavishnu Colour Graphicz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    :root {
      --ink: #1b1c1f; --paper: #f8f7f2; --line: rgba(27, 28, 31, 0.12); --accent: #A0ED32; --coral: #ff5426; --subtext: #646760;
      --sans: "Manrope", Arial, sans-serif; --display: "Space Grotesk", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .site-container { width: min(100% - 48px, 1440px); margin: 0 auto; }
    .site-header { position: sticky; top: 0; z-index: 1030; padding: 24px 0 12px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
    .brand-mark { width: 36px; height: 36px; } .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-copy { display: grid; text-transform: uppercase; line-height: 1; }
    .brand-copy span { font-size: 8px; font-weight: 800; color: #67686a; }
    .brand-copy strong { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--ink); }
    .navbar-capsule { width: min(100%, 820px); min-height: 58px; padding: 0 10px 0 18px; border-radius: 30px; background: rgba(59, 59, 59, 0.85); color: #f9f9f7; }
    .nav-links .nav-link { padding: 9px 14px !important; border-radius: 999px; color: #c4c4c5; font-size: 12px; font-weight: 700; }
    .nav-links .nav-link:hover { color: var(--accent); } .nav-links .nav-link.active { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .quote-button { padding: 10px 18px; border-radius: 999px; background: var(--accent); color: #161a12; font-size: 11px; font-weight: 800; text-decoration: none; }
    .page-banner { padding: clamp(60px, 8vw, 100px) 0 40px; text-align: center; }
    .banner-kicker { font-size: 13px; font-weight: 800; color: var(--coral); text-transform: uppercase; margin-bottom: 12px; }
    .banner-title { font-family: var(--display); font-size: clamp(36px, 5vw, 64px); font-weight: 800; color: var(--ink); text-transform: uppercase; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; padding-bottom: 80px; }
    .gallery-item { border-radius: 24px; overflow: hidden; height: 280px; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 300ms ease; }
    .gallery-item:hover img { transform: scale(1.06); }
  </style>
</head>

<body>
  <header class="site-header" id="top">
    <div class="site-container header-row">
      <a class="brand" href="../index.html">
        <span class="brand-mark"><img src="../assets/images/logo/colour-graphicz.png" alt="Logo"></span>
        <span class="brand-copy"><span>Sri Mahavishnu</span><strong>Colour Graphicz</strong></span>
      </a>
      <div class="navbar-capsule navbar navbar-expand-lg" aria-label="Primary navigation">
        <div class="d-flex align-items-center justify-content-between w-100">
          <button class="nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#navGallery" aria-controls="navGallery" aria-expanded="false" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
          </button>
          <div class="collapse navbar-collapse" id="navGallery">
            <ul class="navbar-nav nav-links mx-auto">
              <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
              <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
              <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
              <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
            </ul>
            <a class="quote-button" href="quotation.html">Get a Free Quote <i class="bi bi-arrow-up-right"></i></a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="site-container">
        <div class="banner-kicker">{ Press Facility }</div>
        <h1 class="banner-title">Behind the Scenes & Machinery</h1>
      </div>
    </section>

    <section>
      <div class="site-container gallery-grid">
        <div class="gallery-item"><img src="../assets/images/agency_main.png" alt="Offset Press Machine"></div>
        <div class="gallery-item"><img src="../assets/images/agency_desk.png" alt="Graphic Studio Setup"></div>
        <div class="gallery-item"><img src="../assets/images/services/packaging.png" alt="Packaging Line"></div>
        <div class="gallery-item"><img src="../assets/images/services/branding.png" alt="Color Matching Studio"></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    "use strict";
    const applyTheme = (dark) => document.body.classList.toggle("dark-mode", dark);
    let mode = localStorage.getItem("theme-mode") || "auto";
    applyTheme(mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches));
    const header = document.querySelector(".site-header");
    window.addEventListener("scroll", () => header?.classList.toggle("is-scrolled", window.scrollY > 10), { passive: true });
  </script>
</body>
</html>
