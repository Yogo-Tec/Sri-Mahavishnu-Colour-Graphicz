<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request a Free Quote - Sri Mahavishnu Colour Graphicz: Get instant custom print & packaging quotes">
  <title>Get a Free Quotation | Sri Mahavishnu Colour Graphicz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --ink: #1b1c1f; --paper: #f8f7f2; --line: rgba(27, 28, 31, 0.12); --accent: #A0ED32; --coral: #ff5426; --subtext: #646760;
      --sans: "Manrope", Arial, sans-serif; --display: "Space Grotesk", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .site-container { width: min(100% - 48px, 1440px); margin: 0 auto; }
    .site-header { position: sticky; top: 0; z-index: 1030; padding: 24px 0 12px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
    .brand-mark { width: 36px; height: 36px; } .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-copy { display: grid; text-transform: uppercase; line-height: 1; }
    .brand-copy span { font-size: 8px; font-weight: 800; color: #67686a; }
    .brand-copy strong { font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--ink); }
    .navbar-capsule { width: min(100%, 820px); min-height: 58px; padding: 0 10px 0 18px; border-radius: 30px; background: rgba(59, 59, 59, 0.85); color: #f9f9f7; }
    .nav-links .nav-link { padding: 9px 14px !important; border-radius: 999px; color: #c4c4c5; font-size: 12px; font-weight: 700; }
    .nav-links .nav-link:hover { color: var(--accent); } .nav-links .nav-link.active { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .quote-button { padding: 10px 18px; border-radius: 999px; background: var(--accent); color: #161a12; font-size: 11px; font-weight: 800; text-decoration: none; }
    .page-banner { padding: clamp(60px, 8vw, 100px) 0 30px; text-align: center; }
    .banner-kicker { font-size: 13px; font-weight: 800; color: var(--coral); text-transform: uppercase; margin-bottom: 12px; }
    .banner-title { font-family: var(--display); font-size: clamp(36px, 5vw, 64px); font-weight: 800; color: var(--ink); text-transform: uppercase; }
    .quote-form-card { border-radius: 32px; padding: clamp(32px, 4vw, 54px); background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 48px rgba(0,0,0,0.08); max-width: 920px; margin: 0 auto 80px; }
    .form-section-title { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--coral); margin-bottom: 20px; text-transform: uppercase; letter-spacing: -.02em; }
    .form-control, .form-select { border-radius: 14px; padding: 14px 18px; border: 1px solid var(--line); font-size: 15px; }
    .btn-submit-quote { width: 100%; padding: 18px; border-radius: 999px; background: var(--accent); color: #111; font-family: var(--display); font-size: 16px; font-weight: 800; border: none; text-transform: uppercase; letter-spacing: .04em; }
    .btn-submit-quote:hover { background: #b8f547; transform: translateY(-2px); }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="site-container d-flex align-items-center justify-content-between">
      <a class="brand" href="../index.html">
        <span class="brand-mark"><img src="../assets/images/logo/colour-graphicz.png" alt="Logo"></span>
        <span class="brand-copy"><span>Sri Mahavishnu</span><strong>Colour Graphicz</strong></span>
      </a>
      <div class="navbar-capsule navbar navbar-expand-lg">
        <div class="d-flex align-items-center justify-content-between w-100">
          <ul class="navbar-nav nav-links mx-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
          </ul>
          <a class="quote-button" href="quotation.html">Get a Free Quote <i class="bi bi-arrow-up-right"></i></a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="site-container">
        <div class="banner-kicker">{ Instant Estimation }</div>
        <h1 class="banner-title">Request Your Custom Quotation</h1>
      </div>
    </section>

    <section>
      <div class="site-container">
        <div class="quote-form-card">
          <form onsubmit="event.preventDefault(); alert('Your quote request has been received! Our print estimator will send a detailed proposal to your email within 2 hours.');">
            <!-- Customer Details -->
            <div class="form-section-title">1. Your Details</div>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label font-weight-bold">Full Name *</label><input type="text" class="form-control" placeholder="John Doe" required></div>
              <div class="col-md-6"><label class="form-label font-weight-bold">Company Name</label><input type="text" class="form-control" placeholder="Acme Brands Inc."></div>
              <div class="col-md-6"><label class="form-label font-weight-bold">Email Address *</label><input type="email" class="form-control" placeholder="john@example.com" required></div>
              <div class="col-md-6"><label class="form-label font-weight-bold">Phone Number *</label><input type="tel" class="form-control" placeholder="+91 98765 43210" required></div>
            </div>

            <!-- Project Specification -->
            <div class="form-section-title">2. Project Specifications</div>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label font-weight-bold">Primary Service Required *</label>
                <select class="form-select" required>
                  <option value="">Select Service...</option>
                  <option>Brand Identity & Logo</option>
                  <option>Commercial Printing (Brochures / Catalogues)</option>
                  <option>Product Packaging & Cartons</option>
                  <option>Labels & Die-Cut Stickers</option>
                  <option>Books & Hardcover Publishing</option>
                  <option>Large Format & Signage</option>
                </select>
              </div>
              <div class="col-md-6"><label class="form-label font-weight-bold">Estimated Quantity *</label><input type="number" class="form-control" placeholder="e.g. 1000" required></div>
              <div class="col-md-6"><label class="form-label font-weight-bold">Finished Dimensions / Size</label><input type="text" class="form-control" placeholder="e.g. A4, 10x12 inches"></div>
              <div class="col-md-6">
                <label class="form-label font-weight-bold">Special Finishing</label>
                <select class="form-select">
                  <option>None / Standard</option>
                  <option>Spot UV Coating</option>
                  <option>Gold / Silver Foil Stamping</option>
                  <option>Matte Lamination</option>
                  <option>Embossing / Debossing</option>
                </select>
              </div>
              <div class="col-12"><label class="form-label font-weight-bold">Project Details & Description</label><textarea class="form-control" rows="4" placeholder="Describe paper stock preferences, artwork ready state, special packaging box structure, etc."></textarea></div>
            </div>

            <button type="submit" class="btn-submit-quote">Submit Quote Request <i class="bi bi-arrow-right ms-2"></i></button>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
